name: Test Examples

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  test-hello-world:
    name: Test hello-world example on ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/hello-world
      
      - name: Build hello-world example
        run: cargo build --release
        working-directory: ./examples/hello-world
        
      - name: Bundle hello-world application
        uses: ./
        with:
          binary-name: hello-world
          include-files: 'examples/hello-world/assets/'
          working-directory: './examples/hello-world/target/release'
          icon-path: 'examples/hello-world/icon.png'
          cargo-toml-path: 'examples/hello-world/Cargo.toml'
          
      - name: List bundle contents (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Bundle contents:"
          tar -tzf dist/hello-world-linux.tar.gz
          
      - name: List bundle contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Bundle contents:"
          Get-Content dist/hello-world-windows.zip -Raw | Out-Null
          if (Get-Command unzip -ErrorAction SilentlyContinue) {
            unzip -l dist/hello-world-windows.zip
          } else {
            Expand-Archive -Path dist/hello-world-windows.zip -DestinationPath dist/extracted -Force
            Get-ChildItem -Recurse dist/extracted
          }
          
      - name: List bundle contents (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Bundle contents:"
          find dist/hello-world-macos.app -type f
          
      - name: Extract and test bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p test-extract
          tar -xzf dist/hello-world-linux.tar.gz -C test-extract
          cd test-extract
          echo "Checking extracted files:"
          ls -la
          ls -la assets/ || echo "No assets directory found"
          echo "Running hello-world binary:"
          ./hello-world
          
      - name: Extract and test bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-extract
          Expand-Archive -Path dist/hello-world-windows.zip -DestinationPath test-extract -Force
          Set-Location test-extract
          Write-Host "Checking extracted files:"
          Get-ChildItem -Force
          if (Test-Path "assets") {
            Get-ChildItem -Force assets
          } else {
            Write-Host "No assets directory found"
          }
          Write-Host "Running hello-world binary:"
          .\hello-world.exe
          
      - name: Test bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Checking bundle structure:"
          ls -la dist/hello-world-macos.app/Contents/MacOS/
          ls -la dist/hello-world-macos.app/Contents/Resources/ || echo "No Resources directory"
          echo "Testing .app bundle execution:"
          # Test executing the .app bundle directly (macOS way)
          open -W -a dist/hello-world-macos.app || true
          # Also test the binary directly for verification
          echo "Testing direct binary execution:"
          cd dist/hello-world-macos.app/Contents/MacOS
          ./hello-world
          
      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-${{ matrix.os }}
          path: dist/*

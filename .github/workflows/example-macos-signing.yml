name: Example - macOS Code Signing

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos-signed-release:
    permissions:
      contents: write
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          
      - name: Build release binary
        run: cargo build --release
        
      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          
      - name: Bundle and Sign macOS Application
        uses: ./
        with:
          binary-name: myapp
          output-name: MyApplication
          macos-sign: true
          macos-sign-identity: "Developer ID Application: Your Name (YOUR_TEAM_ID)"
          macos-bundle-id: com.example.myapp
          macos-app-name: "My Application"
          include-files: 'README.md LICENSE assets/'
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

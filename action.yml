name: 'Rust Bundler'
description: 'Bundle Rust binaries for distribution on macOS, Windows and Linux'
author: 'julcst'
branding:
  icon: 'package'
  color: 'orange'

inputs:
  binary-name:
    description: 'Name of the binary to bundle (without extension). Auto-discovered from Cargo.toml if not provided.'
    required: false
    default: ''
  include-files:
    description: 'Space-separated list of files or folders to include in the bundle'
    required: false
    default: ''
  output-name:
    description: 'Name of the output bundle (without extension, platform suffix will be added)'
    required: false
    default: ''
  working-directory:
    description: 'Working directory (project root). Binary will be auto-discovered in target/release or target/debug.'
    required: false
    default: '.'
  macos-sign:
    description: 'Enable macOS code signing (requires proper keychain setup)'
    required: false
    default: 'false'
  macos-sign-identity:
    description: 'macOS code signing identity'
    required: false
    default: ''
  macos-bundle-id:
    description: 'macOS bundle identifier (e.g., com.example.app)'
    required: false
    default: ''
  macos-app-name:
    description: 'macOS application display name'
    required: false
    default: ''
  icon-path:
    description: 'Path to icon file (PNG format recommended, will be converted for each platform)'
    required: false
    default: ''
  cargo-toml-path:
    description: 'Path to Cargo.toml for extracting metadata (name, version, description, authors)'
    required: false
    default: ''
  profile:
    description: 'Build profile to use (e.g., release, debug, dev, or custom profile name). Defaults to release.'
    required: false
    default: 'release'
  target:
    description: 'Target triple for cross-compilation (e.g., x86_64-unknown-linux-gnu). Optional.'
    required: false
    default: ''

outputs:
  bundle-path:
    description: 'Path to the created bundle'
    value: ${{ steps.bundle.outputs.bundle-path }}
  bundle-name:
    description: 'Name of the created bundle file'
    value: ${{ steps.bundle.outputs.bundle-name }}

runs:
  using: 'composite'
  steps:
    - name: Bundle Application
      id: bundle
      shell: bash
      run: |
        set -e
        
        # Source the bundler script
        source "${{ github.action_path }}/scripts/bundle.sh"
        
        # Call the bundler function
        bundle_application \
          "${{ inputs.binary-name }}" \
          "${{ inputs.include-files }}" \
          "${{ inputs.output-name }}" \
          "${{ inputs.working-directory }}" \
          "${{ inputs.macos-sign }}" \
          "${{ inputs.macos-sign-identity }}" \
          "${{ inputs.macos-bundle-id }}" \
          "${{ inputs.macos-app-name }}" \
          "${{ inputs.icon-path }}" \
          "${{ inputs.cargo-toml-path }}" \
          "${{ inputs.profile }}" \
          "${{ inputs.target }}"
